# Leitstand — als Stack in Portainer einsetzbar.
#
#   Portainer -> Stacks -> Add stack -> Web editor
#   Diese Datei hineinkopieren, "Deploy the stack".
#
# Alle einstellbaren Werte stehen in der .env daneben; ohne sie greifen
# die Vorgaben hinter ":-". In Portainer lassen sich dieselben Werte im
# Formular unter "Environment variables" setzen.
#
# Das Abbild wird bei jedem Push auf main gebaut (.github/workflows/image.yml).
# Ist das GHCR-Paket privat, muss in Portainer unter Registries einmalig ein
# Zugang für ghcr.io hinterlegt werden — Benutzername ist der GitHub-Name,
# Passwort ein Token mit read:packages.
#
# Lieber selbst bauen statt ziehen? Dann Stack -> Repository verwenden und
# die Zeile "image:" durch die beiden auskommentierten "build:"-Zeilen ersetzen.

services:
  leitstand:
    image: ${LEITSTAND_IMAGE:-ghcr.io/dukynuky/leitstand:main}
    # build:
    #   context: .
    container_name: leitstand
    restart: ${LEITSTAND_RESTART:-unless-stopped}

    ports:
      - "${LEITSTAND_BIND:-0.0.0.0}:${LEITSTAND_PORT:-8080}:8080"

    environment:
      TZ: ${TZ:-Europe/Berlin}
      LEITSTAND_ARCHIV: ${LEITSTAND_ARCHIV:-14}

    volumes:
      # Enthält inventory.yaml, secrets.json, incidents.json und archiv/.
      # Beim ersten Start wird der Bestand automatisch angelegt.
      # Ein Wert mit Schrägstrich wird als Pfad auf dem Wirt eingehängt,
      # alles andere als benanntes Volume.
      - ${LEITSTAND_DATA:-leitstand-data}:/data

    # ICMP an Ziele im eigenen Netz: Alpine erlaubt unprivilegiertes ping
    # nur mit dieser Fähigkeit. Ohne sie prüft der Leitstand nur TCP —
    # das genügt für Weboberflächen, nicht für reine Ping-Ziele.
    #
    # Fehlt sie, sagt der Leitstand das: die ICMP-Prüfung gilt als
    # ÜBERSPRUNGEN und nicht als fehlgeschlagen, und in den Einstellungen
    # sowie in der Kurzlage steht der Grund. Wichtig für Tunnel: hat eine
    # Strecke nur ICMP und keinen probe.port, wird über sie dann GAR
    # NICHTS gemessen — sie steht auf Grau, nicht auf Grün.
    #
    # Zur Probe im laufenden Behälter, und zwar als der Benutzer, unter
    # dem der Dienst läuft — als root sagt der Test nichts:
    #   docker exec -u node leitstand ping -c1 10.99.0.2
    cap_add:
      - NET_RAW

    healthcheck:
      # /api/version statt /api/state: gefragt ist, ob der Dienst antwortet —
      # ein Fehler beim Zusammenbauen des Zustands darf keine Neustartschleife
      # auslösen und damit die Überwachung ganz abschalten.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  leitstand-data:
