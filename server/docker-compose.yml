services:
  leitstand:
    build: .
    container_name: leitstand
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data          # inventory.yaml, secrets.json, incidents.json
    environment:
      LEITSTAND_INVENTORY: /data/inventory.yaml
    # Für ICMP an Ziele im eigenen Netz ist Host-Netz oft bequemer.
    # Dann die Portfreigabe oben entfernen:
    # network_mode: host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
