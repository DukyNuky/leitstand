# ============================================================
#  Leitstand — Bestand
#
#  Diese Datei ist die einzige, die du pflegst. Alles andere
#  leitet sich daraus ab: Ampeln, Startseite, Störungen.
#
#  ACHTUNG: Die Werte unten sind aus der Beschreibung geraten.
#  Hostnamen, IPs und Netze anpassen, bevor es losgeht.
#
#  Prüfungen werden automatisch aus `url` und `ip` abgeleitet:
#    url: https://host:8006  ->  TCP 8006 + TLS-Restlaufzeit
#    ip:  10.10.1.11         ->  ICMP (sofern ping vorhanden)
#  Wer das nicht will, setzt `checks:` ausdrücklich.
# ============================================================

settings:
  interval: 15          # Sekunden zwischen zwei Durchläufen
  timeout: 4            # Sekunden je Einzelprüfung
  history: 120          # gespeicherte Messpunkte je Host (120 × 15 s = 30 min)
  fail_threshold: 3     # Fehlschläge in Folge, bis eine Ampel auf Rot geht
  slow_ms: 800          # Antwortzeit, ab der es Gelb gibt
  tls_warn_days: 30
  tls_crit_days: 14
  icmp: true            # auf false, wenn ping fehlt oder ICMP geblockt ist
  listen: 8080
  bind: 0.0.0.0

sites:
  - { id: hq,  name: HQ Zuhause,       place: Köln,              primary: true, isp: "Vodafone Kabel 1000/50" }
  - { id: rz,  name: RZ Falkenstein,   place: "Hetzner AX41",                   isp: "Hetzner Online" }
  - { id: elt, name: Standort Eltern,  place: Bergisch Gladbach,                isp: "Telekom VDSL 250/40" }
  - { id: bue, name: Büro Aachen,      place: Aachen,                           isp: "NetAachen Glas 500/500" }
  - { id: fh,  name: Ferienhaus Eifel, place: Monschau,                         isp: "Telekom DSL 50/10" }

hosts:
  # ---- Virtualisierung ----------------------------------------------------
  - { id: pve-hq-01,  type: pve, site: hq,  ip: 10.10.1.11, url: "https://10.10.1.11:8006",  role: "Cluster-Node · Ryzen 9 5950X" }
  - { id: pve-hq-02,  type: pve, site: hq,  ip: 10.10.1.12, url: "https://10.10.1.12:8006",  role: "Cluster-Node · Dell R730" }
  - { id: pve-hq-03,  type: pve, site: hq,  ip: 10.10.1.13, url: "https://10.10.1.13:8006",  role: "Cluster-Node · Intel NUC 13" }
  - { id: pve-rz-01,  type: pve, site: rz,  ip: 10.30.1.10, url: "https://10.30.1.10:8006",  role: "Standalone · Hetzner AX41-NVMe" }
  - { id: pve-elt-01, type: pve, site: elt, ip: 10.40.1.10, url: "https://10.40.1.10:8006",  role: "Standalone · HP EliteDesk 800" }
  - { id: pve-bue-01, type: pve, site: bue, ip: 10.50.1.10, url: "https://10.50.1.10:8006",  role: "Standalone · Fujitsu TX1330" }

  # ---- Firewalls ----------------------------------------------------------
  - { id: fw-hq-01,  type: opnsense, site: hq,  ip: 10.10.0.1, url: "https://10.10.0.1", role: "OPNsense · CARP MASTER · HAProxy" }
  - { id: fw-hq-02,  type: opnsense, site: hq,  ip: 10.10.0.2, url: "https://10.10.0.2", role: "OPNsense · CARP BACKUP" }
  - { id: fw-rz-01,  type: opnsense, site: rz,  ip: 10.30.0.1, url: "https://10.30.0.1", role: "OPNsense · Standalone · HAProxy" }
  - { id: fw-elt-01, type: opnsense, site: elt, ip: 10.40.0.1, url: "https://10.40.0.1", role: "OPNsense · Standalone" }
  - { id: pf-bue-01, type: pfsense,  site: bue, ip: 10.50.0.1, url: "https://10.50.0.1", role: "pfSense CE · Standalone" }
  - { id: pf-fh-01,  type: pfsense,  site: fh,  ip: 10.60.0.1, url: "https://10.60.0.1", role: "pfSense CE · Standalone" }
  - { id: pf-lab-01, type: pfsense,  site: hq,  ip: 10.10.9.1, url: "https://10.10.9.1", role: "pfSense CE · Labor (nested)", monitor: false }

  # ---- Speicher & Sicherung ----------------------------------------------
  - { id: nas-hq-01, type: truenas, site: hq, ip: 10.10.2.20, url: "https://10.10.2.20",      role: "TrueNAS SCALE · 8× 12 TB Z2" }
  - { id: pbs-hq-01, type: pbs,     site: hq, ip: 10.10.2.30, url: "https://10.10.2.30:8007", role: "Proxmox Backup Server · lokal" }
  - { id: pbs-rz-01, type: pbs,     site: rz, ip: 10.30.2.30, url: "https://10.30.2.30:8007", role: "Proxmox Backup Server · Offsite-Sync" }

  # ---- Mail ---------------------------------------------------------------
  - { id: pmg-rz-01,     type: pmg,     site: rz, ip: 10.30.2.40, url: "https://10.30.2.40:8006", role: "Proxmox Mail Gateway" }
  - { id: mailcow-rz-01, type: mailcow, site: rz, ip: 10.30.2.50, url: "https://10.30.2.50", role: "Mailcow dockerized",
      checks: [ { kind: icmp }, { kind: tcp, port: 443 }, { kind: tcp, port: 25 }, { kind: tcp, port: 993 }, { kind: tls, port: 443, servername: "mail.example.de" } ] }

  # ---- Dienste ------------------------------------------------------------
  - { id: adguard-hq-01, type: adguard, site: hq, ip: 10.10.3.10, url: "https://10.10.3.10", role: "AdGuard Home · primär",
      checks: [ { kind: icmp }, { kind: tcp, port: 443 }, { kind: dns, port: 53, query: "example.com" } ] }
  - { id: adguard-hq-02, type: adguard, site: hq, ip: 10.10.3.11, url: "https://10.10.3.11", role: "AdGuard Home · sekundär",
      checks: [ { kind: icmp }, { kind: tcp, port: 443 }, { kind: dns, port: 53, query: "example.com" } ] }
  - { id: adguard-rz-01, type: adguard, site: rz, ip: 10.30.3.10, url: "https://10.30.3.10", role: "AdGuard Home · Remote/DoH",
      checks: [ { kind: icmp }, { kind: tcp, port: 443 }, { kind: dns, port: 53, query: "example.com" } ] }
  - { id: ha-hq-01, type: hass, site: hq, ip: 10.10.4.10, url: "https://10.10.4.10:8123", role: "Home Assistant OS" }

  # ---- Container ----------------------------------------------------------
  - { id: portainer-hq,  type: portainer, site: hq,  ip: 10.10.5.10, url: "https://10.10.5.10:9443", role: "Portainer CE · Docker Standalone" }
  - { id: portainer-nas, type: portainer, site: hq,  ip: 10.10.2.21, url: "https://10.10.2.21:9443", role: "Portainer Agent · TrueNAS Apps" }
  - { id: portainer-rz,  type: portainer, site: rz,  ip: 10.30.5.10, url: "https://10.30.5.10:9443", role: "Portainer CE · Docker Standalone" }
  - { id: portainer-bue, type: portainer, site: bue, ip: 10.50.5.10, url: "https://10.50.5.10:9443", role: "Portainer CE · Docker Standalone" }

# ============================================================
#  Tunnel
#
#  Stufe 1 liest den WireGuard-Status noch nicht aus der Firewall.
#  Stattdessen wird DURCH den Tunnel geprüft: `probe` zeigt auf die
#  Gegenstelle im Transfernetz. Das misst, was zählt — ob der Tunnel
#  gerade trägt — und braucht keinerlei Zugangsdaten.
# ============================================================
tunnels:
  - { id: wg-hq-rz,  a: hq, b: rz,  iface: wg0, net: 10.99.0.0/30,  probe: { ip: 10.99.0.2,  port: 22 } }
  - { id: wg-hq-elt, a: hq, b: elt, iface: wg1, net: 10.99.0.4/30,  probe: { ip: 10.99.0.6,  port: 22 } }
  - { id: wg-hq-bue, a: hq, b: bue, iface: wg2, net: 10.99.0.8/30,  probe: { ip: 10.99.0.10, port: 22 } }
  - { id: wg-hq-fh,  a: hq, b: fh,  iface: wg3, net: 10.99.0.12/30, probe: { ip: 10.99.0.14, port: 22 } }
  - { id: wg-rz-elt, a: rz, b: elt, iface: wg1, net: 10.99.0.16/30, probe: { ip: 10.99.0.18, port: 22 } }
  - { id: wg-rz-bue, a: rz, b: bue, iface: wg2, net: 10.99.0.20/30, probe: { ip: 10.99.0.22, port: 22 } }

