# ============================================================
#  Leitstand — Bestand
#
#  Diese Datei ist die einzige, die gepflegt wird. Alles andere leitet
#  sich daraus ab: Ampeln, Startseite, Störungen. Pflegen geht in der
#  Oberfläche unter „Verwaltung" oder von Hand — nach einer Änderung von
#  Hand: Verwaltung → Bestand neu einlesen.
#
#  ────────────────────────────────────────────────────────────
#  DIES IST EIN BEISPIELBESTAND.
#
#  Er enthält je EIN Beispiel pro Systemtyp und pro Funktion, damit man
#  sieht, wie ein Eintrag aussieht. Die Adressen zeigen ins Leere
#  (Dokumentationsnetz 10.x) — bis sie durch echte ersetzt sind, stehen
#  diese Systeme auf Rot. Das ist gewollt: eine Überwachung, die für ein
#  nicht vorhandenes Gerät Grün zeigt, wäre wertlos.
#
#  Erster Schritt: Beispiele löschen oder auf die eigenen Adressen
#  ziehen. Einzig `leitstand` unten trifft zu — das ist dieser Dienst.
#  ────────────────────────────────────────────────────────────
#
#  Prüfungen werden automatisch aus `url` und `ip` abgeleitet:
#    url: https://host:8006  ->  TCP 8006 + TLS-Restlaufzeit
#    ip:  10.10.1.11         ->  ICMP (sofern ping vorhanden)
#
#  Wer das nicht will, setzt `checks:` ausdrücklich — siehe adguard-01.
#
#  Port und TLS werden an der IP versucht und, wenn dort nichts antwortet,
#  am Namen aus der url. Das ist der Fall „Oberfläche hinter einem Reverse
#  Proxy": auf dem System selbst steht kein 443 offen, unter seinem Namen
#  kommt die Seite trotzdem. ICMP und DNS fragen weiter nur die IP.
# ============================================================

settings:
  interval: 15          # Sekunden zwischen zwei Durchläufen
  timeout: 4            # Sekunden je Einzelprüfung
  history: 120          # gespeicherte Messpunkte je Host (120 × 15 s = 30 min)
  fail_threshold: 3     # Fehlschläge in Folge, bis eine Ampel auf Rot geht
  slow_ms: 800          # Antwortzeit, ab der es Gelb gibt
  tls_warn_days: 30
  tls_crit_days: 14
  icmp: true            # auf false, wenn ping fehlt oder ICMP geblockt ist
  listen: 8080
  bind: 0.0.0.0

# ============================================================
#  Standorte — mindestens einer muss angelegt sein.
#  `primary: true` markiert den Hauptstandort; er steht in der
#  Topologie in der Mitte.
# ============================================================
sites:
  # Das Kürzel hat vier Stellen: Land + Stadt. DEKO = Deutschland/Köln,
  # ATWI = Österreich/Wien. Feste Breite, weil es in der Filterleiste, in
  # der Topologie und in jeder Tabellenzeile steht.
  - { id: hq, name: Hauptstandort, short: DEKO, place: Köln,      primary: true, isp: "" }
  - { id: rz, name: Zweitstandort, short: DEFR, place: Frankfurt, isp: "" }

# ============================================================
#  Systeme — je ein Beispiel pro Typ.
#
#  Typen mit Sammler (Kennzahlen über die API, Zugangsdaten in der
#  Verwaltung hinterlegen):  pve · pbs · pmg
#  Alle übrigen werden vorerst nur auf Erreichbarkeit geprüft.
# ============================================================
hosts:
  # ---- Der Leitstand selbst -----------------------------------------------
  # Das einzige Beispiel, das wirklich antwortet: die Selbstprüfung. Zeigt,
  # wie eine grüne Ampel aussieht, und bleibt auch sinnvoll, wenn alle
  # anderen Beispiele gelöscht sind.
  - { id: leitstand, type: other, site: hq, ip: 127.0.0.1, url: "http://127.0.0.1:8080",
      role: "Leitstand — dieser Dienst" }

  # ---- Virtualisierung ----------------------------------------------------
  # Proxmox VE liefert mit hinterlegtem Token CPU, RAM, Speicher, VMs/LXC,
  # Cluster-Quorum und Version. Die Kennung muss dem Knotennamen im Cluster
  # entsprechen. Token anlegen: Datacenter → Permissions → API Tokens,
  # Rolle PVEAuditor auf / mit Vererbung. Nur lesend.
  - { id: pve-01, type: pve, site: hq, ip: 10.10.1.11, url: "https://10.10.1.11:8006",
      role: "Proxmox VE · Cluster-Node" }

  # ---- Sicherung ----------------------------------------------------------
  # Proxmox Backup Server: Datastore-Belegung und fehlgeschlagene Aufträge.
  - { id: pbs-01, type: pbs, site: hq, ip: 10.10.2.30, url: "https://10.10.2.30:8007",
      role: "Proxmox Backup Server" }

  # ---- Mail ---------------------------------------------------------------
  # Proxmox Mail Gateway: Ein-/Ausgang, Spam- und Virenzahlen.
  - { id: pmg-01, type: pmg, site: rz, ip: 10.30.2.40, url: "https://10.30.2.40:8006",
      role: "Proxmox Mail Gateway" }

  # Mailcow: eigene Prüfliste statt der abgeleiteten — so wird neben der
  # Weboberfläche auch SMTP und IMAP geprüft. `servername` gehört dazu,
  # wenn das Zertifikat auf einen Namen und nicht auf die IP lautet.
  - { id: mailcow-01, type: mailcow, site: rz, ip: 10.30.2.50, url: "https://10.30.2.50",
      role: "Mailcow dockerized",
      checks: [ { kind: icmp },
                { kind: tcp, port: 443 },
                { kind: tcp, port: 25 },
                { kind: tcp, port: 993 },
                { kind: tls, port: 443, servername: "mail.example.org" } ] }

  # ---- Netz ---------------------------------------------------------------
  - { id: fw-01, type: opnsense, site: hq, ip: 10.10.0.1, url: "https://10.10.0.1",
      role: "OPNsense · Firewall & VPN" }
  - { id: fw-02, type: pfsense,  site: rz, ip: 10.30.0.1, url: "https://10.30.0.1",
      role: "pfSense · Firewall" }

  # ---- Speicher -----------------------------------------------------------
  - { id: nas-01, type: truenas, site: hq, ip: 10.10.2.20, url: "https://10.10.2.20",
      role: "TrueNAS SCALE" }

  # ---- Dienste ------------------------------------------------------------
  # AdGuard mit ausdrücklicher DNS-Prüfung: es wird wirklich aufgelöst,
  # nicht nur der Port geöffnet. Ein DNS-Dienst, der annimmt aber nicht
  # antwortet, fiele sonst nicht auf.
  - { id: adguard-01, type: adguard, site: hq, ip: 10.10.3.10, url: "https://10.10.3.10",
      role: "AdGuard Home · DNS-Filter",
      checks: [ { kind: icmp },
                { kind: tcp, port: 443 },
                { kind: dns, port: 53, query: "example.org" } ] }

  - { id: portainer-01, type: portainer, site: hq, ip: 10.10.5.10, url: "https://10.10.5.10:9443",
      role: "Portainer CE" }
  - { id: ha-01, type: hass, site: hq, ip: 10.10.4.10, url: "https://10.10.4.10:8123",
      role: "Home Assistant" }

  # ---- Absichtlich unüberwacht --------------------------------------------
  # `monitor: false` heißt: taucht überall auf, bleibt grau, alarmiert nie.
  # Für Labor- und Bastelsysteme, die nachts aus sein dürfen.
  - { id: lab-01, type: other, site: hq, ip: 10.10.9.1, url: "https://10.10.9.1",
      role: "Laborsystem — nicht überwacht", monitor: false }

# ============================================================
#  Tunnel
#
#  Eine Strecke lässt sich auf zwei Weisen beurteilen:
#
#  `probe`  — es wird DURCH den Tunnel auf die Gegenstelle im Transfernetz
#             geprüft. Das misst, was zählt (trägt die Strecke gerade?) und
#             braucht keinerlei Zugangsdaten. Ohne `probe.port` nur ICMP.
#
#  `peer`   — der WireGuard-Peer auf einer Firewall, die der Leitstand
#             ausliest. Daraus kommen Handshake-Alter und übertragene
#             Menge. Der Handshake sagt etwas anderes als die Messung:
#             wann die Strecke zuletzt STAND, nicht ob gerade etwas
#             hindurchkommt.
#
#  Eines von beidem muss es sein, am besten beides. Ausgewählt wird der
#  Peer in der Verwaltung aus dem, was die Firewalls tatsächlich melden —
#  von Hand geht es auch: `host` ist das System, das ihn meldet, `key` der
#  öffentliche Schlüssel (überlebt eine Umbenennung), `name` und `iface`
#  sind Beschriftung und Rückfall.
# ============================================================
tunnels:
  - { id: wg-hq-rz, a: hq, b: rz, iface: wg0, net: 10.99.0.0/30,
      probe: { ip: 10.99.0.2, port: 22 },
      peer: { host: fw-01, iface: wg0, name: WG-Zweitstandort } }

# ============================================================
#  Startseite
#
#  `host:` verknüpft eine Kachel mit einem überwachten System — dann trägt
#  die Kachel dessen Ampel und übernimmt dessen Adresse. Ohne `host:` ist
#  es ein reiner Lesezeichen-Eintrag und bleibt grau. `url:` überschreibt
#  die Adresse des Systems, etwa für einen Unterpfad.
# ============================================================
links:
  - group: Infrastruktur
    items:
      - { name: Leitstand,      host: leitstand }
      - { name: Proxmox VE,     host: pve-01 }
      - { name: Backup Server,  host: pbs-01 }
      - { name: Firewall HQ,    host: fw-01 }
  - group: Dienste
    items:
      - { name: TrueNAS,        host: nas-01 }
      - { name: AdGuard Home,   host: adguard-01 }
      - { name: Portainer,      host: portainer-01 }
      - { name: Home Assistant, host: ha-01 }
      - { name: Mailcow Admin,  host: mailcow-01, url: "https://10.30.2.50/admin" }
  - group: Extern
    items:
      - { name: "Beispiel-Lesezeichen ohne System", url: "https://example.org" }
