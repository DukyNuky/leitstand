name: Abbild bauen

# Baut bei jedem Push auf main ein Abbild und legt es in der GitHub
# Container Registry ab. Damit lässt sich der Leitstand in Portainer als
# Stack einsetzen, ohne auf dem Docker-Wirt etwas zu bauen.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: |
          cd server
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Wann wurde festgeschrieben, wann gebaut? Beides wandert ins Abbild und
      # steht danach in der Oberfläche unten links — bei automatischem Redeploy
      # ist das die einzige verlässliche Antwort auf „läuft schon der neue Stand?"
      - id: herkunft
        run: |
          echo "committed=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./server/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LEITSTAND_COMMIT=${{ github.sha }}
            LEITSTAND_BRANCH=${{ github.ref_name }}
            LEITSTAND_COMMITTED=${{ steps.herkunft.outputs.committed }}
            LEITSTAND_BUILT=${{ steps.herkunft.outputs.built }}
            LEITSTAND_VERSION=${{ steps.herkunft.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
